paths:
  train_source1: data/train/train_source1.tsv
  train_source2: data/train/train_source2.tsv
  train_source3: data/train/train_source3.tsv
  train_gt: data/train/train_ground_truth.tsv
  test_source1: data/test/test_source1.tsv
  test_source2: data/test/test_source2.tsv
  test_source3: data/test/test_source3.tsv
  parquet_dir: data/parquet
  embedding_dir: data/embeddings
  index_dir: data/indexes
  phonetic_index: data/indexes/phonetic_blocks.duckdb
  candidate_pairs: data/candidates/candidate_pairs.parquet
  faiss_candidate_pairs: data/candidates/faiss_candidate_pairs.parquet
  phonetic_candidate_pairs: data/candidates/phonetic_candidate_pairs.parquet
  labeled_pairs: data/candidates/labeled_pairs.parquet
  feature_dir: data/features/train
  entity_store: data/entity_store.duckdb
  model_dir: models/lgbm

retrieval:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 512
  query_batch_size: 4096
  top_k: 50
  hnsw_m: 32
  ef_construction: 200
  ef_search: 128
  phonetic_per_query_limit: 20

training:
  random_state: 42
  test_size: 0.2
  feature_chunk_size: 100000
  max_training_rows: 5000000
  negative_to_positive_ratio: 10
  hard_negatives_per_positive: 5

model:
  num_leaves: 64
  learning_rate: 0.05
  n_estimators: 500
  n_jobs: -1
  early_stopping_rounds: 50

threshold:
  start: 0.50
  stop: 0.95
  step: 0.05
